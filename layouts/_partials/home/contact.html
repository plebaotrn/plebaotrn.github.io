<section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="wrap">
        <div class="contact-bunny" aria-hidden="true"><canvas id="cbunny"></canvas></div>
        <div class="kicker">Contact</div>
        <h2 class="big" id="contact-title">Let's work<br>together.</h2>
        <p>{{ site.Params.available }}</p>
        <div class="mag-wrap">
          <div class="mag"><button class="btn btn-solid" id="copy" type="button">Copy email</button></div>
          <div class="mag"><a class="btn" href="{{ site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn ↗</a></div>
          <div class="mag"><a class="btn" href="{{ site.Params.github }}" target="_blank" rel="noopener">GitHub ↗</a></div>
        </div>
        <div class="email-line" id="email">{{ site.Params.email }}</div>
      </div>
    </section>
  </div>
