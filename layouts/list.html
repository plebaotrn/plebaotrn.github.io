{{ define "main" }}
{{ partial "page-nav.html" . }}
<main>
  <section class="wrap article">
    <div class="kicker">Writing</div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="lead">{{ . }}</p>{{ end }}
    <div class="posts post-list">
      {{- range .Pages.ByDate.Reverse }}
      <a class="post" href="{{ .RelPermalink }}"><span class="date">{{ .Date.Format "Jan 2006" }}</span><span class="title">{{ .Title }}</span><span class="tag">{{ .Params.tag }}</span></a>
      {{- end }}
    </div>
  </section>
</main>
{{ partial "footer.html" . }}
{{ end }}
