- title: HSRC Wholebeing Science
  slug: hsrc
  post: /writing/building-hsrc-bilingual-ux
  image: hsrc.png
  type: Client project
  year: '2025'
  role: Designer and developer
  timeline: May 2025 to present
  team: Individual
  lead: The official website for the Human Sciences Research Centre in Vietnam, in both Vietnamese and English.
  overview: "HSRC studies Wholebeing Science, which is about how people live well and feel well. The site needed to work for two groups: Vietnamese researchers who already know HSRC, and international partners who are meeting it for the first time. The first group wanted more detail, the second needed more background. I designed and built the whole site to serve both."
  did:
  - Worked with the HSRC team to understand the two audiences and plan a separate path through the site for each.
  - Designed the interface in Figma in Vietnamese and English, using colours and type taken from the HSRC brand. Some sections show content in a different order for each language, because each audience starts from a different place.
  - Built the landing page around a 3D lotus made with Three.js. Its five petals stand for the five parts of SPIRE, and they float apart and come back together as you scroll.
  - Built the Meaning Card tool, where you answer a few questions and get a personal phone wallpaper.
  - Built the Happiness Map, a short 13 question quiz that shows where you stand on the five SPIRE pillars, with charts for your results.
  - Added team profiles and an articles section on Supabase, so the team can post news on their own.
  outcome: The site is live at hsrc.vn, works in two languages, and I keep adding to it as HSRC grows.
  stack:
  - Next.js 15
  - TypeScript
  - Tailwind CSS
  - Three.js
  - Supabase
  link: https://www.hsrc.vn/
  linkLabel: Visit hsrc.vn

- title: CoBunny
  slug: cobunny
  post: /writing/designing-cobunny-figma-to-vue-3
  image: cobunny.png
  type: University project
  year: '2025'
  role: Full stack developer
  timeline: Nov to Dec 2025
  team: Individual
  lead: A booking site for coworking spaces, made for students and freelancers in Melbourne.
  overview: "Booking a desk to study should be quick. The tools I tried had too many steps, unclear availability and no easy way to see past bookings. I built CoBunny on my own for my Interface Design and Development unit: you browse spaces, look at the details, sign in and book. Then you can view, edit or cancel your booking from one dashboard."
  did:
  - Designed every screen in Figma before writing any code, so each part had a clear job from the start.
  - Built a browse page with search, filters for location, price and size, sorting and a favourites heart on every space.
  - Built a details page for each space with photos, features, size, price and location, so people have everything they need before they book.
  - Wrote my own sign in and sign up logic as a reusable Vue composable, and protected the dashboard and booking pages so only signed in users can open them.
  - Kept all booking data in one Pinia store, so the booking form and the dashboard always show the same thing.
  - Built a dashboard with upcoming, past and cancelled bookings, plus quick stats like total bookings and money spent. The edit form fills in your old details, so you only change what you need.
  process:
  - Talked to three university students about how they find and book study spaces.
  - 'Mapped the steps: find, compare, book and manage.'
  - Designed every screen in Figma, from rough sketches to the final look, and cut the booking flow from five steps to three.
  - Built the basic pages first with sample data, then added accounts, bookings and the dashboard.
  - At first I passed booking data from page to page by hand. It got messy fast, so I moved it into a shared Pinia store and the problem went away.
  - The first version saved everything in the browser. After the unit I moved sign in and bookings to Supabase, so data now works across devices.
  outcome: "A simple booking site that works well on phones and covers the full journey, from finding a space to managing your bookings. My biggest lesson: pick one styling tool and stick with it. I used both Bootstrap and Tailwind, and they kept fighting each other."
  gallery:
  - src: cobunny/designsytem.png
    caption: The design system in Figma. Colours, type sizes, icons and the CoBunny logo, all set before any code.
  - src: cobunny/wireframe.png
    caption: Every page and shared part laid out in Figma, from the home page to the three booking steps.
  - src: cobunny/browse.png
    caption: Browse page with search, filters and sorting. The heart adds a space to your favourites.
  - src: cobunny/space-details.png
    caption: Each space has its own page with photos, price, rating and features.
  - src: cobunny/booking-form.png
    caption: The booking form shows a live summary and total price next to your choices.
  stack:
  - Vue 3
  - Pinia
  - Vue Router
  - Bootstrap 5
  - Tailwind CSS
  - Vite
  - Supabase
  - Figma
  link: https://github.com/plebaotrn/CoBunny-web
  linkLabel: Source on GitHub

- title: Happier
  slug: happier
  post: /writing/building-happier-habit-tracker
  image: happier.png
  type: University project
  year: '2025'
  role: Mobile developer
  timeline: Nov to Dec 2025
  team: Individual
  lead: An Android app that helps you build good habits, one day at a time.
  overview: "Starting a habit is easy. Keeping it going is the hard part. Most habit apps I tried felt like too much work, so I built Happier for my mobile development unit: a simple Android app where you can tick off a habit in a few taps, see your progress at a glance, and get a small push when you need it. It works fully offline, so it is always ready when you are."
  did:
  - Designed a warm orange look with big cards and large buttons that are easy to tap with one thumb.
  - Built a home screen with three tabs, Today, Weekly and Overall, so you can look at your habits in different ways.
  - Built a weekly view with a circle for each day. Forgot to tick yesterday? Just tap that day.
  - Stored everything on the phone with Room, using a separate table for each completed day so streaks and weekly views stay accurate.
  - Used the MVVM pattern with ViewModel and LiveData, so the screen updates the moment you tick off a habit.
  - Added a home screen widget with today's progress, swipe to delete with an undo button, and encouraging messages that change with your progress.
  process:
  - Wrote user stories first, like a busy student who wants to tick off a habit in seconds, or someone who wants a widget so they never need to open the app.
  - Planned the screens and the database before writing any code.
  - Started by counting only the total days done, then added a table that records each day, so the weekly view and streaks could work properly.
  - Tested on a Pixel 6 emulator and fixed bugs along the way, like progress going above 100 percent and days not matching because of different times.
  - Built the app in about 30 hours over two weeks.
  outcome: A friendly habit tracker that covers the full journey, from creating a habit to checking it off from your home screen. The biggest lesson was to plan first. Drawing the screens and the database before coding saved me a lot of time later.
  gallery:
  - src: happier/today.png
    caption: The Today tab with your habits for the day.
  - src: happier/weekly.png
    caption: The Weekly tab. Tap any day to mark it done.
  - src: happier/overall.png
    caption: The Overall tab with your stats in one place.
  - src: happier/add-habit.png
    caption: Creating a habit with your own icon and colour.
  - src: happier/habit-detail.png
    caption: Each habit has its own page with streaks and progress.
  - src: happier/widget.png
    caption: The home screen widget shows today at a glance.
  stack:
  - Kotlin
  - Android Studio
  - Room
  - SQLite
  - LiveData
  - Coroutines
  - Material Design 3
  link: https://github.com/plebaotrn/Happier_Habit_Tracker
  linkLabel: Source on GitHub

