- title: HSRC Wholebeing Science
  image: hsrc.png
  type: Client project
  year: '2025'
  role: Designer and developer
  timeline: May 2025 to present
  team: Individual
  lead: The official bilingual website for the Human Sciences Research Centre in Vietnam.
  overview: 'HSRC works on Wholebeing Science, an interdisciplinary approach to human flourishing. The site had to serve two audiences at once: Vietnamese researchers who already know the centre, and international partners meeting it for the first time.'
  did:
  - Ran research with the HSRC team to define two audiences and map a separate journey for each.
  - Designed a bilingual interface in Figma with design tokens based on the HSRC brand.
  - Built an interactive 3D model of the SPIRE framework with Three.js and React Three Fiber.
  - Developed a Meaning Card wallpaper generator, team profiles and an articles system.
  stack:
  - Next.js 15
  - TypeScript
  - Tailwind CSS
  - Three.js
  - React Three Fiber
  - Supabase
  link: https://www.hsrc.vn/
  linkLabel: Visit hsrc.vn

- title: CoBunny
  image: cobunny.png
  type: University project
  year: '2025'
  role: Full stack developer
  timeline: Nov to Dec 2025
  team: Individual
  lead: A co-working space booking platform for students and freelancers in Melbourne.
  overview: 'Existing booking tools were complex and hard to use on a phone. I was responsible for the full product: research, interface design, frontend and backend integration.'
  did:
  - Designed the booking flow end to end, from interface to backend.
  - Designed responsive screens in Figma before development.
  - Integrated a real time Supabase backend for persistent storage.
  process:
  - Interviewed three university students about how they find and book study spaces.
  - 'Mapped the journey: discover, compare, book and manage.'
  - 'Identified the problems: too many steps, unclear availability and no booking history.'
  - Designed every screen in Figma, from wireframes to high fidelity.
  - Tested the prototype and reduced the booking flow from five steps to three.
  outcome: A clear, mobile friendly booking experience with real time availability and booking history. Test participants described the final flow as straightforward.
  stack:
  - Vue 3
  - Bootstrap 5
  - Vite
  - Supabase
  - Figma
  link: https://github.com/plebaotrn
  linkLabel: Source on GitHub

