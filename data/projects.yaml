- title: MConnect
  slug: mconnect
  image: mconnect.jpg
  type: Team project
  year: '2025'
  role: Designer and developer
  timeline: May to Aug 2025
  team: Team of three
  lead: A networking site for professionals, where people can join communities, share posts and build a profile.
  overview: "MConnect was built with plain JavaScript, without frameworks like React or Vue, on an Express and SQLite backend. Our team of three split the work by feature. I designed the first version of the main pages and then built the parts people touch every day: signing in, liking posts and editing their profile."
  did:
  - Designed and built the first version of the home, community, login and sign up pages, with styles organised in SCSS.
  - Built the login and sign up forms with clear password rules and helpful error messages, and switched sign in from usernames to email.
  - Made the header a shared component that loads on every page, so a change only needs to be made once.
  - Built the like feature from the database to the button, so posts show likes straight away.
  - Built the profile page, where people can edit their details and upload an avatar, plus the check that only lets signed in users make changes.
  - Handled photo sizes for avatars and post images, so large uploads don't slow the site down.
  stack:
  - JavaScript
  - HTML
  - SCSS
  - Express
  - SQLite
  link: https://github.com/Pandazelf/COS20031-May-Group-1
  linkLabel: Source on GitHub
